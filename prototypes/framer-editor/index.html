<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Groove Scribe Framer Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <style>
    :root {
      --bg: #f3f3f3;
      --panel: #ffffff;
      --panel-soft: #f7f7f7;
      --line: #e5e5e5;
      --line-strong: #d7d7d7;
      --text: #1f1f1f;
      --muted: #6d6d6d;
      --soft-text: #9a9a9a;
      --blue: #0099ff;
      --blue-soft: #e8f4ff;
      --green: #19a35b;
      --shadow: 0 18px 60px rgba(0, 0, 0, .10);
      --shadow-soft: 0 6px 20px rgba(0, 0, 0, .08);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      background: transparent;
      cursor: pointer;
      color: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: 260px minmax(620px, 1fr) 260px;
      grid-template-rows: 50px minmax(0, 1fr);
      height: 100vh;
    }

    .topbar {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 260px 1fr 260px;
      align-items: center;
      height: 50px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .top-left,
    .top-center,
    .top-right {
      display: flex;
      align-items: center;
      height: 100%;
      gap: 8px;
      padding: 0 10px;
    }

    .top-center {
      justify-content: center;
      gap: 10px;
    }

    .top-right {
      justify-content: flex-end;
    }

    .canvas-menu {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 32px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
      font-weight: 600;
      font-size: 13px;
    }

    .icon-button {
      width: 32px;
      height: 32px;
      display: inline-grid;
      place-items: center;
      border-radius: 8px;
      color: #555;
      transition: background .16s ease, color .16s ease, transform .16s ease;
    }

    .icon-button:hover,
    .icon-button.active {
      background: #f0f0f0;
      color: #111;
    }

    .icon-button.primary {
      background: var(--blue);
      color: white;
      box-shadow: 0 7px 18px rgba(0, 153, 255, .24);
    }

    .title {
      font-size: 13px;
      font-weight: 700;
    }

    .branch {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 24px;
      padding: 0 8px;
      border-radius: 6px;
      background: #f2f2f2;
      color: var(--muted);
      font-size: 11px;
    }

    .button {
      height: 32px;
      padding: 0 13px;
      border-radius: 8px;
      background: #f1f1f1;
      color: #282828;
      font-size: 13px;
      font-weight: 600;
    }

    .button.blue {
      background: var(--blue);
      color: white;
      box-shadow: 0 8px 18px rgba(0, 153, 255, .24);
    }

    .avatar {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: var(--blue);
      color: white;
      font-size: 13px;
      font-weight: 700;
    }

    .left-panel,
    .right-panel {
      background: var(--panel);
      border-right: 1px solid var(--line);
      overflow: auto;
    }

    .right-panel {
      border-right: 0;
      border-left: 1px solid var(--line);
    }

    .panel-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 10px;
      border-bottom: 1px solid var(--line);
    }

    .tab {
      height: 30px;
      padding: 0 12px;
      border-radius: 8px;
      color: #777;
      font-size: 13px;
      font-weight: 500;
    }

    .tab.active {
      background: #f1f1f1;
      color: #111;
      font-weight: 700;
    }

    .search {
      margin: 10px;
      height: 32px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 10px;
      background: #f4f4f4;
      border-radius: 8px;
      color: var(--soft-text);
      font-size: 13px;
    }

    .panel-section {
      padding: 12px 10px;
      border-top: 1px solid var(--line);
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
      color: #303030;
      font-size: 13px;
      font-weight: 700;
    }

    .page-row,
    .layer-row {
      display: flex;
      align-items: center;
      gap: 9px;
      height: 32px;
      padding: 0 9px;
      border-radius: 8px;
      color: #333;
      font-size: 13px;
    }

    .page-row.active,
    .layer-row.active {
      background: #f1f1f1;
      font-weight: 700;
    }

    .layer-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--line-strong);
    }

    .layer-dot.blue {
      background: var(--blue);
    }

    .layer-dot.green {
      background: var(--green);
    }

    .stage {
      position: relative;
      overflow: hidden;
      background: #ededed;
    }

    .canvas {
      height: 100%;
      overflow: auto;
      padding: 60px 52px 116px;
    }

    .work-surface {
      max-width: 980px;
      min-width: 720px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .03);
    }

    .score-header {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
    }

    .score-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .logo-mark {
      width: 26px;
      height: 26px;
      object-fit: contain;
      border-radius: 6px;
      background: #111;
      padding: 3px;
    }

    .score-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 26px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fafafa;
      color: #555;
      font-size: 12px;
      font-weight: 600;
    }

    .notation {
      padding: 34px 42px 30px;
      border-bottom: 1px solid var(--line);
    }

    .staff {
      position: relative;
      height: 86px;
      border-left: 2px solid #222;
      border-right: 2px solid #222;
      background:
        linear-gradient(#222, #222) 0 15px / 100% 1px no-repeat,
        linear-gradient(#222, #222) 0 29px / 100% 1px no-repeat,
        linear-gradient(#222, #222) 0 43px / 100% 1px no-repeat,
        linear-gradient(#222, #222) 0 57px / 100% 1px no-repeat,
        linear-gradient(#222, #222) 0 71px / 100% 1px no-repeat;
    }

    .time-sig {
      position: absolute;
      left: 14px;
      top: 8px;
      display: grid;
      gap: 1px;
      font-size: 26px;
      font-weight: 700;
      line-height: .82;
    }

    .barline {
      position: absolute;
      top: 15px;
      width: 1px;
      height: 56px;
      background: #222;
    }

    .barline.one { left: 25%; }
    .barline.two { left: 50%; }
    .barline.three { left: 75%; }

    .note {
      position: absolute;
      width: 12px;
      height: 9px;
      border-radius: 50%;
      background: #111;
      transform: rotate(-16deg);
    }

    .note.kick-a { left: 74px; top: 64px; }
    .note.kick-b { left: 538px; top: 64px; }
    .note.snare-a { left: 304px; top: 43px; background: transparent; border: 2px solid #111; }
    .note.hat-a { left: 74px; top: 2px; }
    .note.hat-b { left: 188px; top: 2px; }
    .note.hat-c { left: 304px; top: 2px; }
    .note.hat-d { left: 420px; top: 2px; }

    .grid-card {
      padding: 28px 38px 32px;
      background: linear-gradient(180deg, #fff 0%, #fbfbfb 100%);
    }

    .grid-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .field-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .field {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #555;
      font-size: 12px;
      font-weight: 600;
    }

    .field span {
      width: 116px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel);
      color: #111;
      font-weight: 500;
    }

    .drum-grid {
      display: grid;
      grid-template-columns: 76px repeat(16, minmax(22px, 1fr)) 36px;
      gap: 8px 8px;
      align-items: center;
    }

    .lane-label {
      color: #222;
      font-size: 14px;
      font-weight: 600;
      text-align: right;
    }

    .cell {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      justify-self: center;
      border: 2px solid #c8c8c8;
      background: white;
      color: transparent;
      transition: border-color .14s ease, background .14s ease, transform .14s ease;
    }

    .cell:hover {
      border-color: var(--blue);
      transform: scale(1.08);
    }

    .cell.on {
      border-color: #111;
      background: #111;
    }

    .cell.x {
      border: 0;
      background: transparent;
      color: #b7b7b7;
      font-size: 20px;
      font-weight: 700;
    }

    .cell.x.on {
      color: #111;
    }

    .beat {
      position: relative;
    }

    .beat::before {
      content: "";
      position: absolute;
      inset: -84px -4px -14px;
      border-radius: 5px;
      background: var(--blue-soft);
      z-index: -1;
    }

    .add-lane {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: var(--blue);
      font-size: 25px;
      justify-self: center;
    }

    .bottom-actions {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      border-top: 1px solid var(--line);
      background: #fafafa;
    }

    .action {
      height: 74px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 6px;
      color: #777;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      border-right: 1px solid var(--line);
    }

    .action:last-child {
      border-right: 0;
    }

    .action i {
      font-size: 22px;
      color: #9a9a9a;
    }

    .floating-tools {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      height: 54px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, .92);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .tool-separator {
      width: 1px;
      height: 28px;
      background: var(--line);
      margin: 0 2px;
    }

    .tempo-chip {
      height: 34px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 12px;
      border-radius: 10px;
      background: #f4f4f4;
      color: #333;
      font-size: 13px;
      font-weight: 700;
    }

    .right-panel {
      padding-bottom: 12px;
    }

    .inspector-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px;
      border-bottom: 1px solid var(--line);
    }

    .property-group {
      padding: 15px 12px;
      border-bottom: 1px solid var(--line);
    }

    .property-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 13px;
      font-size: 13px;
      font-weight: 700;
    }

    .control-row {
      display: grid;
      grid-template-columns: 74px 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      color: #666;
      font-size: 12px;
    }

    .input-like,
    .select-like {
      min-width: 0;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      border-radius: 8px;
      background: #f4f4f4;
      color: #333;
      font-size: 12px;
      font-weight: 600;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      padding: 2px;
      border-radius: 9px;
      background: #f0f0f0;
    }

    .segment {
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      color: #777;
      font-size: 12px;
      font-weight: 700;
    }

    .segment.active {
      background: white;
      color: var(--blue);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .08);
    }

    .slider {
      height: 4px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--blue) 0 52%, #e1e1e1 52% 100%);
    }

    @media (max-width: 1100px) {
      .app {
        grid-template-columns: 72px minmax(600px, 1fr) 248px;
      }

      .topbar {
        grid-template-columns: 72px 1fr 248px;
      }

      .left-panel .panel-tabs,
      .left-panel .search,
      .left-panel .section-title span,
      .left-panel .page-row span,
      .left-panel .layer-row span {
        display: none;
      }

      .left-panel .panel-section {
        padding: 10px;
      }

      .page-row,
      .layer-row {
        justify-content: center;
        padding: 0;
      }

      .canvas {
        padding-left: 28px;
        padding-right: 28px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="top-left">
        <button class="canvas-menu" aria-label="Canvas menu">
          <i class="ph-bold ph-cursor-click"></i>
          <span>Canvas</span>
          <i class="ph ph-caret-down"></i>
        </button>
        <button class="icon-button" aria-label="Add"><i class="ph ph-plus"></i></button>
        <button class="icon-button active" aria-label="Selection tool"><i class="ph ph-selection"></i></button>
        <button class="icon-button" aria-label="Text"><i class="ph ph-text-t"></i></button>
      </div>
      <div class="top-center">
        <span class="title">Groove Scribe</span>
        <span class="branch"><i class="ph ph-git-branch"></i> framer-prototype</span>
      </div>
      <div class="top-right">
        <span class="avatar">AL</span>
        <button class="icon-button" aria-label="Preview"><i class="ph-fill ph-play"></i></button>
        <button class="button">Invite</button>
        <button class="button blue">Publish</button>
      </div>
    </header>

    <aside class="left-panel">
      <div class="panel-tabs">
        <button class="tab active">Pages</button>
        <button class="tab">Layers</button>
        <button class="tab">Assets</button>
      </div>
      <div class="search"><i class="ph ph-magnifying-glass"></i><span>Search...</span></div>
      <section class="panel-section">
        <div class="section-title"><span>Design</span><i class="ph ph-plus"></i></div>
        <button class="page-row active"><i class="ph-fill ph-house"></i><span>Editor</span></button>
      </section>
      <section class="panel-section">
        <div class="section-title"><span>Layers</span><i class="ph ph-plus"></i></div>
        <button class="layer-row active"><span class="layer-dot blue"></span><span>Sheet Canvas</span></button>
        <button class="layer-row"><span class="layer-dot green"></span><span>Drum Grid</span></button>
        <button class="layer-row"><span class="layer-dot"></span><span>Transport</span></button>
        <button class="layer-row"><span class="layer-dot"></span><span>Inspector</span></button>
      </section>
    </aside>

    <section class="stage">
      <div class="canvas">
        <article class="work-surface">
          <div class="score-header">
            <div class="score-title">
              <img class="logo-mark" src="../../images/GScribe_Logo_lone_g.svg" alt="Groove Scribe">
              <span>Untitled one-bar groove</span>
            </div>
            <div class="score-meta">
              <span class="pill"><i class="ph ph-clock"></i> 4/4</span>
              <span class="pill"><i class="ph ph-grid-four"></i> 1/16</span>
              <span class="pill"><i class="ph ph-metronome"></i> 4th</span>
            </div>
          </div>

          <section class="notation" aria-label="Notation preview">
            <div class="staff">
              <div class="time-sig"><span>4</span><span>4</span></div>
              <span class="barline one"></span>
              <span class="barline two"></span>
              <span class="barline three"></span>
              <span class="note kick-a"></span>
              <span class="note kick-b"></span>
              <span class="note snare-a"></span>
              <span class="note hat-a"></span>
              <span class="note hat-b"></span>
              <span class="note hat-c"></span>
              <span class="note hat-d"></span>
            </div>
          </section>

          <section class="grid-card">
            <div class="grid-top">
              <div class="field-row">
                <label class="field">Title <span>First groove</span></label>
                <label class="field">Author <span>Arturo</span></label>
                <label class="field">Comment <span>Framer study</span></label>
              </div>
              <button class="icon-button" aria-label="Notation key"><i class="ph ph-key"></i></button>
            </div>

            <div class="drum-grid" aria-label="Drum editor">
              <div class="lane-label">Hi-hat</div>
              <button class="cell x on">x</button><button class="cell x">x</button><button class="cell x">x</button><button class="cell x">x</button>
              <button class="cell x on beat">x</button><button class="cell x">x</button><button class="cell x">x</button><button class="cell x">x</button>
              <button class="cell x on">x</button><button class="cell x">x</button><button class="cell x">x</button><button class="cell x">x</button>
              <button class="cell x on">x</button><button class="cell x">x</button><button class="cell x">x</button><button class="cell x">x</button>
              <button class="add-lane" aria-label="Add lane"><i class="ph-bold ph-plus"></i></button>

              <div class="lane-label">Snare</div>
              <button class="cell"></button><button class="cell"></button><button class="cell"></button><button class="cell"></button>
              <button class="cell"></button><button class="cell"></button><button class="cell"></button><button class="cell"></button>
              <button class="cell on"></button><button class="cell"></button><button class="cell"></button><button class="cell"></button>
              <button class="cell"></button><button class="cell"></button><button class="cell"></button><button class="cell"></button>
              <span></span>

              <div class="lane-label">Kick</div>
              <button class="cell on"></button><button class="cell"></button><button class="cell"></button><button class="cell"></button>
              <button class="cell"></button><button class="cell"></button><button class="cell"></button><button class="cell"></button>
              <button class="cell"></button><button class="cell"></button><button class="cell"></button><button class="cell"></button>
              <button class="cell on"></button><button class="cell"></button><button class="cell"></button><button class="cell"></button>
              <span></span>
            </div>
          </section>

          <footer class="bottom-actions">
            <button class="action"><i class="ph ph-trash"></i><span>Clear</span></button>
            <button class="action"><i class="ph ph-circles-three"></i><span>Toms</span></button>
            <button class="action"><i class="ph ph-arrows-out"></i><span>Sticking</span></button>
            <button class="action"><i class="ph ph-download-simple"></i><span>Download</span></button>
            <button class="action"><i class="ph ph-printer"></i><span>Print</span></button>
            <button class="action"><i class="ph ph-share-network"></i><span>Share</span></button>
          </footer>
        </article>
      </div>

      <nav class="floating-tools" aria-label="Floating transport controls">
        <button class="icon-button primary" aria-label="Play"><i class="ph-fill ph-play"></i></button>
        <button class="icon-button" aria-label="Hand"><i class="ph ph-hand"></i></button>
        <button class="icon-button" aria-label="Loop"><i class="ph ph-repeat"></i></button>
        <button class="icon-button" aria-label="Metronome"><i class="ph ph-metronome"></i></button>
        <span class="tool-separator"></span>
        <div class="tempo-chip"><span>90 BPM</span><i class="ph ph-caret-down"></i></div>
      </nav>
    </section>

    <aside class="right-panel">
      <div class="inspector-header">
        <button class="tab active">Agent</button>
        <button class="tab">Style</button>
      </div>

      <section class="property-group">
        <div class="property-title">Groove</div>
        <div class="control-row"><span>Time</span><div class="select-like">4 / 4 <i class="ph ph-caret-down"></i></div></div>
        <div class="control-row"><span>Division</span><div class="select-like">1 / 16 <i class="ph ph-caret-down"></i></div></div>
        <div class="control-row"><span>Measures</span><div class="input-like">1</div></div>
      </section>

      <section class="property-group">
        <div class="property-title">Transport <i class="ph ph-minus"></i></div>
        <div class="control-row"><span>Tempo</span><div class="input-like">90 BPM</div></div>
        <div class="control-row"><span>Swing</span><div class="input-like">0%</div></div>
        <div class="control-row"><span></span><div class="slider"></div></div>
      </section>

      <section class="property-group">
        <div class="property-title">Metronome</div>
        <div class="segmented">
          <button class="segment">Off</button>
          <button class="segment active">4th</button>
          <button class="segment">8th</button>
        </div>
      </section>

      <section class="property-group">
        <div class="property-title">Layout</div>
        <div class="control-row"><span>Align</span><div class="select-like">Center <i class="ph ph-caret-down"></i></div></div>
        <div class="control-row"><span>Width</span><div class="input-like">980</div></div>
        <div class="control-row"><span>Gap</span><div class="input-like">10</div></div>
      </section>
    </aside>
  </main>

  <script>
    document.querySelectorAll(".cell").forEach((cell) => {
      cell.addEventListener("click", () => cell.classList.toggle("on"));
    });

    document.querySelectorAll(".tab, .segment, .icon-button").forEach((button) => {
      button.addEventListener("click", () => {
        const parent = button.parentElement;
        if (!parent || !button.classList.contains("segment")) return;
        parent.querySelectorAll(".segment").forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
      });
    });
  </script>
</body>
</html>
