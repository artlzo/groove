<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ritmo × Engine — notation spike</title>
<!-- Only the engine pieces needed to render notation headlessly -->
<script src="../../js/abc2svg-1.js"></script>
<script src="../../js/groove_utils.js"></script>
<style>
  body{font-family:Inter,system-ui,sans-serif;margin:0;padding:32px;background:#f2f2f2;color:#333}
  h1{font-size:15px;font-weight:600;margin:0 0 4px}
  p{font-size:12px;color:#888;margin:0 0 20px}
  .card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:24px;max-width:900px;box-shadow:0 2px 16px rgba(0,0,0,.06)}
  .svgTarget svg{display:block;width:100%;height:auto}
  #err{color:#b00;font-family:monospace;font-size:12px;white-space:pre-wrap}
</style>
</head>
<body>
  <h1>Ritmo × GrooveScribe engine — notation spike</h1>
  <p>Rendered headlessly via getGrooveDataFromUrlString → createABCFromGrooveData → renderABCtoSVG. No writer DOM.</p>
  <div class="card"><div id="svgTarget" class="svgTarget"></div></div>
  <div id="err"></div>

<script>
(function () {
  // A standard 4/4 16th-note rock groove in GrooveScribe URL format.
  // H = hi-hat, S = snare (O = accent), K = kick. '-' = rest.
  var grooveUrl =
    "?TimeSig=4/4&Div=16&Tempo=80&Measures=1" +
    "&H=|xxxxxxxxxxxxxxxx|" +
    "&S=|----O-------O---|" +
    "&K=|o-------o-------|";

  try {
    var utils = new GrooveUtils();
    var grooveData = utils.getGrooveDataFromUrlString(grooveUrl);
    var abc = utils.createABCFromGrooveData(grooveData, 700);
    var out = utils.renderABCtoSVG(abc);
    document.getElementById("svgTarget").innerHTML = out.svg;
    if (out.error_html) document.getElementById("err").textContent = "ABC errors:\n" + out.error_html;
    // expose for inspection
    window.__spike = { grooveData: grooveData, abc: abc, svgLen: (out.svg || "").length };
  } catch (e) {
    document.getElementById("err").textContent = "EXCEPTION: " + (e && e.stack || e);
  }
})();
</script>
</body>
</html>
